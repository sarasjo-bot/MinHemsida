<!DOCTYPE html>
<html>
<head>
    <title>Saras & Ailas hemsida 😛😽</title>
    <style>
        body{
            background-color: lightpink;
            text-align: center;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            padding-top: 100px;
        }
        h1{
            color:purple;
        }
        p {
            font-size: 20px;
        }
        button{
            padding: 15px 25px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
        }
        #ja{
            background-color: #ff69b4;
            color:white;
        }
        #nej{
            background-color: white;
            color: #d63384;
        }
    </style>
</head>

<body>
    <h1>Hejsan! 😊</h1>
    <p>Vill du komma över och laga middag med mig?🍝🕯️ </p>
    <button id="ja">JA! 🧡</button>
    <button id="nej">NEJ 😿</button>

    <p id="meddelande"></p>

    <script>
        const nej = document.getElementById("nej");
        function flyttaNej() {
    const x = Math.random() * (window.innerWidth - nej.offsetWidth - 20);
    const y = Math.random() * (window.innerHeight - nej.offsetHeight - 20);

    nej.style.position = "fixed";
    nej.style.left = x + "px";
    nej.style.top = y + "px";
}
nej.addEventListener("mouseover", flyttaNej);
nej.addEventListener("touchstart", function(event) {
    event.preventDefault();
    flyttaNej();
});
        const ja = document.getElementById("ja");
        const meddelande = document.getElementById("meddelande");
        ja.addEventListener("click",function(){
            meddelande.textContent = "JAAAA!🥹🧡 Jag längtar efter att laga middag med dig! 🍝🕯️💕";
        });
    </script>
</body>
</html>
